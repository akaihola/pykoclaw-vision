[project]
name = "pykoclaw-vision"
version = "0.1.0"
description = "Vision capabilities (image analysis, generation, editing) for pykoclaw plugins"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "claude-agent-sdk"]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
]
